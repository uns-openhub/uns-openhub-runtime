name: Release validation

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - run: bash scripts/verify-runtime.sh
